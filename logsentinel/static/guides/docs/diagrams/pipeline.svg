<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">LogSentinel processing flow</title><desc id="desc">Raw record, parser, normalized event, duplicate key, SQLite, correlation, alert, analyst review.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4bdeb0"/></marker></defs><rect width="1000" height="430" rx="12" fill="#131c27"/><rect x="25" y="65" width="215" height="90" rx="10" fill="#1c2c37" stroke="#426154"/><text x="40" y="93" fill="#4bdeb0" font-size="13" font-family="sans-serif">01</text><text x="40" y="122" fill="#e0eaf4" font-size="14" font-family="sans-serif">Raw record</text><path d="M240 110h27" stroke="#4bdeb0" marker-end="url(#arrow)"/><rect x="270" y="65" width="215" height="90" rx="10" fill="#1c2c37" stroke="#426154"/><text x="285" y="93" fill="#4bdeb0" font-size="13" font-family="sans-serif">02</text><text x="285" y="122" fill="#e0eaf4" font-size="14" font-family="sans-serif">Parser + validation</text><path d="M485 110h27" stroke="#4bdeb0" marker-end="url(#arrow)"/><rect x="515" y="65" width="215" height="90" rx="10" fill="#1c2c37" stroke="#426154"/><text x="530" y="93" fill="#4bdeb0" font-size="13" font-family="sans-serif">03</text><text x="530" y="122" fill="#e0eaf4" font-size="14" font-family="sans-serif">Normalized UTC event</text><path d="M730 110h27" stroke="#4bdeb0" marker-end="url(#arrow)"/><rect x="760" y="65" width="215" height="90" rx="10" fill="#1c2c37" stroke="#426154"/><text x="775" y="93" fill="#4bdeb0" font-size="13" font-family="sans-serif">04</text><text x="775" y="122" fill="#e0eaf4" font-size="14" font-family="sans-serif">SHA-256 duplicate key</text><rect x="25" y="255" width="215" height="90" rx="10" fill="#1c2c37" stroke="#426154"/><text x="40" y="283" fill="#4bdeb0" font-size="13" font-family="sans-serif">05</text><text x="40" y="312" fill="#e0eaf4" font-size="14" font-family="sans-serif">SQLite transaction</text><path d="M240 300h27" stroke="#4bdeb0" marker-end="url(#arrow)"/><rect x="270" y="255" width="215" height="90" rx="10" fill="#1c2c37" stroke="#426154"/><text x="285" y="283" fill="#4bdeb0" font-size="13" font-family="sans-serif">06</text><text x="285" y="312" fill="#e0eaf4" font-size="14" font-family="sans-serif">Event-time correlation</text><path d="M485 300h27" stroke="#4bdeb0" marker-end="url(#arrow)"/><rect x="515" y="255" width="215" height="90" rx="10" fill="#1c2c37" stroke="#426154"/><text x="530" y="283" fill="#4bdeb0" font-size="13" font-family="sans-serif">07</text><text x="530" y="312" fill="#e0eaf4" font-size="14" font-family="sans-serif">Alert + linked evidence</text><path d="M730 300h27" stroke="#4bdeb0" marker-end="url(#arrow)"/><rect x="760" y="255" width="215" height="90" rx="10" fill="#1c2c37" stroke="#426154"/><text x="775" y="283" fill="#4bdeb0" font-size="13" font-family="sans-serif">08</text><text x="775" y="312" fill="#e0eaf4" font-size="14" font-family="sans-serif">Analyst review</text><path d="M867 155v47H132v48" stroke="#4bdeb0" fill="none" marker-end="url(#arrow)"/></svg>